services:
  db:
    image: postgres:16-alpine
    container_name: forti_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: forti_membership
      POSTGRES_USER: forti
      POSTGRES_PASSWORD: forti@2026
    ports:
      - "5435:5432"
    volumes:
      - forti_db_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forti -d forti_membership"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: forti_backend
    restart: unless-stopped
    ports:
      - "7000:7000"
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
    volumes:
      - ./backend/src:/app/src
    depends_on:
      db:
        condition: service_healthy

volumes:
  forti_db_data:
